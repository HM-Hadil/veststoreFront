<!-- cart.component.html -->
<div class="cart-container">
  <h2>Votre Panier</h2>
  
  <div *ngIf="isLoading" class="loading">
    Chargement de votre panier...
  </div>
  
  <div *ngIf="!isLoading && cartItems.length === 0" class="empty-cart">
    <p>Votre panier est vide</p>
    <button routerLink="/product" class="shop-btn">Retour aux produits</button>
  </div>
  
  <div *ngIf="!isLoading && cartItems.length > 0">
    <table class="cart-table">
      <thead>
        <tr>
          <th>Produit</th>
          <th>Taille</th>
          <th>Couleur</th>
          <th>Prix unitaire</th>
          <th>Quantité</th>
          <th>Total</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of cartItems">
          <td>{{ item.productName }}</td>
          <td>{{ item.size }}</td>
          <td>
            <span class="color-circle" [style.background-color]="item.color"></span>
            {{ item.color }}
          </td>
          <td>{{ item.price }}</td>
          <td>
            <div class="quantity-controls">
              <button (click)="updateItemQuantity(item.id, item.quantity - 1)" [disabled]="item.quantity <= 1">-</button>
              <span>{{ item.quantity }}</span>
              <button (click)="updateItemQuantity(item.id, item.quantity + 1)">+</button>
            </div>
          </td>
          <td>{{ item.price * item.quantity }}</td>
          <td>
            <button class="remove-btn" (click)="removeItem(item.id)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
    
    <div class="cart-summary">
      <p>Total: <strong>{{ calculateTotal() }}</strong></p>
      <button class="checkout-btn" (click)="checkout()">Passer la commande</button>
      <button class="clear-btn" (click)="clearCart()">Vider le panier</button>
    </div>
  </div>
</div>
